[[known_gap]]
id = "GAP-A-001"
phase = "A"
status = "closed"
description = "The maintained office NVIDIA host was unreachable at audit. It was reached on 2026-08-30 and validation/hardware.toml now records the observed inventory: two NVIDIA RTX A4000 at 16 GiB each, driver 580.173.02, Pop!_OS 22.04, 36 CPU cores, 62 GiB RAM. Its existing stellarator_venv carries jax 0.6.2, below the floor DKX needs, so a GPU lane still requires its own environment before any accelerator claim is published."

[[known_gap]]
id = "GAP-A-002"
phase = "A"
description = "Branch protection on main declares no required status checks and no required reviews. Twenty-one green checks on the audited commit are advisory. plan.md section 3.4 requires this to be verified and enforced."

[[known_gap]]
id = "GAP-A-003"
phase = "A"
description = "A fresh clone from origin is 36.46 MiB against the 20 MiB target. The Git object store alone is 22.35 MiB, so no working-tree reduction can close the gap; only an explicitly approved history rewrite can, and that is Phase I work."

[[known_gap]]
id = "GAP-A-004"
phase = "A"
status = "closed"
description = "The Phase A audit reported three summaries with no named generator. Two of them, full_kinetic_sfincs_finite_er_v1.json and full_kinetic_sfincs_stellarator_v1.json, were a false positive: the shared audit_full_kinetic_sfincs_validation.py audits all three full-kinetic artifacts and is invoked with --artifact, so a filename grep did not see it. Only w7x_admitted_grid_uniform_probe_no_go_v1.json truly had none. Phase B added audit_w7x_admitted_grid_uniform_probe_no_go.py and validation/registry.toml now records a command for every entry."

[[known_gap]]
id = "GAP-A-005"
phase = "A"
description = "validation/capabilities.toml still carries baseline_commit c003ba8e from 2026-08-28 and does not name every capability tracked by plan.md section 12. Phase B rebuilds the registry rather than patching it here."

[[known_gap]]
id = "GAP-A-006"
phase = "A"
status = "partly_closed"
description = "Published performance claims cite a MacBook with an Apple M4 that is in no hardware registry; the campaign artifacts recording the same chip call it a Mac mini, registered as campaign-mac-mini-m4. A protocol-conformant re-measurement of the tier-1 HSX PAS/DKES row on official-laptop-cpu is in validation/benchmarks/hsx_pas_dkes_tier1_official_laptop_v1.json: warm solve 27.97 s median against a recorded 27.2 s, which reproduces, and peak process RSS 1.68 GB against a recorded 0.93 GB, which does not. Cross-machine runtime deltas of this size are noise and are not worth documenting; the memory gap is worth resolving only when someone re-measures on the original host or the page states its RSS definition. This is a documentation-provenance gap, not a physics or numerics one, and it should not block plan work."



